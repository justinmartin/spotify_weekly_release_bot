name: Spotify Weekly Release Bot

on:
  schedule:
    # Vendredi 6h06 UTC (7h06 Paris l'hiver, 8h06 l'été)
    - cron: '6 6 * * FRI'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (ni playlist ni mail)"
        type: boolean
        default: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Spotify Weekly Bot
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SPOTIPY_REFRESH_TOKEN: ${{ secrets.SPOTIPY_REFRESH_TOKEN }}
          GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
          ROLLING_PLAYLIST: ${{ vars.ROLLING_PLAYLIST }}
        run: python app.py ${{ inputs.dry_run && '--dry-run' || '' }}

  # Empêche GitHub de désactiver ce workflow après 60 jours sans commit
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/spotify-weekly.yml/enable"
